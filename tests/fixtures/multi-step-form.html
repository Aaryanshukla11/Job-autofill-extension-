<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Form 4 — Multi-Step Application Wizard</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f1f5f9; color: #0f172a; }
    .wizard-container { max-width: 600px; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #cbd5e1; margin: 0 auto; }
    .steps-nav { display: flex; gap: 8px; margin-bottom: 20px; font-size: 12px; font-weight: bold; }
    .step-badge { flex: 1; padding: 8px; text-align: center; border-radius: 4px; background: #e2e8f0; color: #64748b; }
    .step-badge.active { background: #3b82f6; color: #fff; }
    .form-step { display: none; }
    .form-step.active { display: block; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input[type=text], input[type=email], textarea { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    .wizard-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    .btn-next { background: #2563eb; color: #fff; }
    .btn-submit { background: #16a34a; color: #fff; }
  </style>
</head>
<body>
  <div class="wizard-container">
    <h2>Multi-Step Application Wizard</h2>
    <div class="steps-nav">
      <div id="badge-step-1" class="step-badge active">1. Personal</div>
      <div id="badge-step-2" class="step-badge">2. Experience</div>
      <div id="badge-step-3" class="step-badge">3. Questions</div>
      <div id="badge-step-4" class="step-badge">4. Review</div>
    </div>

    <!-- Step 1: Personal (Active) -->
    <div id="step-1" class="form-step active">
      <h3>Step 1: Personal Information</h3>
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" />
      </div>
      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" />
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" />
      </div>
      <div class="wizard-buttons">
        <span></span>
        <button type="button" id="btn-next-step1" class="btn btn-next" onclick="goToStep(2)">Next: Experience →</button>
      </div>
    </div>

    <!-- Step 2: Experience (Hidden) -->
    <div id="step-2" class="form-step">
      <h3>Step 2: Professional Experience</h3>
      <div class="form-group">
        <label for="title">Current Job Title</label>
        <input type="text" id="title" name="title" />
      </div>
      <div class="form-group">
        <label for="company">Current Company</label>
        <input type="text" id="company" name="company" />
      </div>
      <div class="form-group">
        <label for="experience">Total Years of Experience</label>
        <input type="text" id="experience" name="experience" />
      </div>
      <div class="wizard-buttons">
        <button type="button" class="btn" onclick="goToStep(1)">← Back</button>
        <button type="button" id="btn-next-step2" class="btn btn-next" onclick="goToStep(3)">Next: Questions →</button>
      </div>
    </div>

    <!-- Step 3: Questions (Hidden) -->
    <div id="step-3" class="form-step">
      <h3>Step 3: Application Questions</h3>
      <div class="form-group">
        <label for="coverLetter">Why are you interested in this role?</label>
        <textarea id="coverLetter" name="coverLetter" rows="4"></textarea>
      </div>
      <div class="wizard-buttons">
        <button type="button" class="btn" onclick="goToStep(2)">← Back</button>
        <button type="button" id="btn-next-step3" class="btn btn-next" onclick="goToStep(4)">Next: Review →</button>
      </div>
    </div>

    <!-- Step 4: Review (Hidden) -->
    <div id="step-4" class="form-step">
      <h3>Step 4: Final Review & Submission</h3>
      <p>Please review your details before final submission.</p>
      <div class="wizard-buttons">
        <button type="button" class="btn" onclick="goToStep(3)">← Back</button>
        <button type="button" id="btn-final-submit" class="btn btn-submit">Submit Application</button>
      </div>
    </div>
  </div>

  <script>
    function goToStep(stepNum) {
      document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.step-badge').forEach(b => b.classList.remove('active'));
      document.getElementById('step-' + stepNum).classList.add('active');
      document.getElementById('badge-step-' + stepNum).classList.add('active');
    }
  </script>
</body>
</html>
