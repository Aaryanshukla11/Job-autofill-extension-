<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Form 8 — Difficult / Complex Form with Uploads & Actions</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
    .form-container { max-width: 650px; background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; margin: 0 auto; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #94a3b8; }
    input[type=text], input[type=email], input[type=file] { width: 100%; padding: 8px; border: 1px solid #475569; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
    .editor-box { min-height: 100px; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: #fff; }
    .action-row { display: flex; gap: 8px; margin-top: 20px; }
    .btn { flex: 1; padding: 10px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; }
    .btn-next { background: #3b82f6; color: #fff; }
    .btn-apply { background: #8b5cf6; color: #fff; }
    .btn-submit { background: #16a34a; color: #fff; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Enterprise Workday Application Form</h2>
    <form id="difficult-form">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" />
      </div>

      <!-- File Upload Input -->
      <div class="form-group">
        <label for="resumeUpload">Resume / CV Attachment (PDF or DOCX)</label>
        <input type="file" id="resumeUpload" name="resumeUpload" accept=".pdf,.docx" />
      </div>

      <!-- Contenteditable Rich Text Editor -->
      <div class="form-group">
        <label for="richEditor">Cover Letter / Executive Summary (Rich Text)</label>
        <div id="richEditor" contenteditable="true" class="editor-box">Type your cover letter here...</div>
      </div>

      <div class="action-row">
        <button type="button" id="btn-next" class="btn btn-next">Next</button>
        <button type="button" id="btn-continue" class="btn btn-next">Continue</button>
        <button type="button" id="btn-apply" class="btn btn-apply">Apply</button>
        <button type="button" id="btn-submit-app" class="btn btn-submit">Submit Application</button>
      </div>
    </form>
  </div>

  <script>
    // Track button clicks to verify extension NEVER clicks them programmatically
    window.clickedButtons = [];
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        window.clickedButtons.push(btn.id || btn.textContent.trim());
      });
    });
  </script>
</body>
</html>
