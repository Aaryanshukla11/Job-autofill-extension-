<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Form 3 — React-Like Synthetic State Form</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #f8fafc; }
    .form-container { max-width: 600px; background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; margin: 0 auto; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #94a3b8; }
    input[type=text], input[type=email] { width: 100%; padding: 8px; border: 1px solid #475569; border-radius: 4px; background: #0f172a; color: #fff; box-sizing: border-box; }
    .state-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 6px; }
    .badge-empty { background: #dc2626; color: #fff; }
    .badge-valid { background: #16a34a; color: #fff; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>React SPA Candidate Portal</h2>
    <form id="react-form">
      <div class="form-group">
        <label for="firstName">First Name <span id="st-firstName" class="state-badge badge-empty">Empty</span></label>
        <input type="text" id="firstName" name="firstName" />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name <span id="st-lastName" class="state-badge badge-empty">Empty</span></label>
        <input type="text" id="lastName" name="lastName" />
      </div>

      <div class="form-group">
        <label for="email">Email Address <span id="st-email" class="state-badge badge-empty">Empty</span></label>
        <input type="email" id="email" name="email" />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span id="st-phone" class="state-badge badge-empty">Empty</span></label>
        <input type="text" id="phone" name="phone" />
      </div>
    </form>
  </div>

  <script>
    // Simulate React Component State Management
    window.reactState = { firstName: '', lastName: '', email: '', phone: '' };

    function bindReactInput(id, key) {
      const el = document.getElementById(id);
      const badge = document.getElementById('st-' + id);
      if (!el || !badge) return;

      const updateState = (e) => {
        window.reactState[key] = el.value;
        if (el.value.trim().length > 0) {
          badge.textContent = 'Valid: ' + el.value;
          badge.className = 'state-badge badge-valid';
        } else {
          badge.textContent = 'Empty';
          badge.className = 'state-badge badge-empty';
        }
      };

      el.addEventListener('input', updateState);
      el.addEventListener('change', updateState);
      el.addEventListener('blur', updateState);
    }

    bindReactInput('firstName', 'firstName');
    bindReactInput('lastName', 'lastName');
    bindReactInput('email', 'email');
    bindReactInput('phone', 'phone');
  </script>
</body>
</html>
