<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Form 5 — Unknown / Open-Ended Questions</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #fafafa; color: #171717; }
    .form-container { max-width: 650px; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e5e5e5; margin: 0 auto; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    textarea { width: 100%; padding: 10px; border: 1px solid #d4d4d4; border-radius: 6px; font-family: inherit; font-size: 13px; box-sizing: border-box; }
    .btn-submit { background: #2563eb; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Supplemental Application Questions</h2>
    <form id="questions-form">
      <div class="form-group">
        <label for="q_motivation">Why are you interested in this role?</label>
        <textarea id="q_motivation" name="q_motivation" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="q_project">Describe your strongest project.</label>
        <textarea id="q_project" name="q_project" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="q_background">Tell us about your professional background.</label>
        <textarea id="q_background" name="q_background" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="q_strengths">What are your strengths?</label>
        <textarea id="q_strengths" name="q_strengths" rows="4"></textarea>
      </div>

      <button type="button" class="btn-submit">Submit Responses</button>
    </form>
  </div>
</body>
</html>
