<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Form 2 — Non-Standard / Obfuscated Fields</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
    .form-container { max-width: 600px; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin: 0 auto; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    input[type=text] { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Applicant Quick Form (Legacy Schema)</h2>
    <form id="legacy-form">
      <div class="form-group">
        <label for="fld_9182">First Name</label>
        <input type="text" id="fld_9182" name="fld_9182" />
      </div>

      <div class="form-group">
        <label for="fld_9183">Family Name / Surname</label>
        <input type="text" id="fld_9183" name="fld_9183" />
      </div>

      <div class="form-group">
        <label for="candidate_email_address">Email Address for Correspondence</label>
        <input type="text" id="candidate_email_address" name="candidate_email_address" />
      </div>

      <div class="form-group">
        <label for="userMobile">Cell / Mobile Number</label>
        <input type="text" id="userMobile" name="userMobile" />
      </div>

      <div class="form-group">
        <label for="contact_person_phone">Alternate Contact Telephone</label>
        <input type="text" id="contact_person_phone" name="contact_person_phone" />
      </div>

      <div class="form-group">
        <label for="candidate_profile_url">LinkedIn URL</label>
        <input type="text" id="candidate_profile_url" name="candidate_profile_url" />
      </div>

      <div class="form-group">
        <label for="inp_curr_title">Current Designation / Job Title</label>
        <input type="text" id="inp_curr_title" name="inp_curr_title" />
      </div>

      <button type="button" class="btn-submit">Apply Now</button>
    </form>
  </div>
</body>
</html>
